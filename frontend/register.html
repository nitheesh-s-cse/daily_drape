<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Daily Drape</title>

    <link rel="stylesheet" href="css/register.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

</head>


<body>

    <main class="register-page">

        <!-- Left Section -->

        <section class="register-visual">

            <div class="brand">

                <span class="brand-mark">D</span>

                <span class="brand-name">
                    Daily Drape
                </span>

            </div>


            <div class="visual-content">

                <p class="eyebrow">
                    YOUR STYLE. YOUR STORY.
                </p>

                <h1>
                    Find pieces
                    <span>that feel like you.</span>
                </h1>

                <p>
                    Create your Daily Drape account and
                    discover fashion made for every moment.
                </p>

            </div>


            <div class="circle circle-one"></div>

            <div class="circle circle-two"></div>

        </section>


        <!-- Registration Section -->

        <section class="form-section">

            <div class="register-card">


                <!-- Mobile Brand -->

                <div class="mobile-brand">

                    <span class="brand-mark">
                        D
                    </span>

                    <span class="brand-name">
                        Daily Drape
                    </span>

                </div>


                <!-- Heading -->

                <div class="heading">

                    <p class="small-title">
                        JOIN DAILY DRAPE
                    </p>

                    <h2>
                        Create your account
                    </h2>

                    <p>
                        Start discovering styles you'll love.
                    </p>

                </div>


                <!-- Registration Form -->

                <form id="registerForm">


                    <!-- Name -->

                    <div class="input-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Mobile -->

                    <div class="input-group">

                        <label for="mobile">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            placeholder="Enter your mobile number"
                            maxlength="10"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="eye-button"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- Confirm Password -->

                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Re-enter your password"
                                required
                            >

                            <button
                                type="button"
                                id="toggleConfirmPassword"
                                class="eye-button"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- Terms -->

                    <label class="terms-checkbox">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#">Terms</a>
                            and
                            <a href="#">Privacy Policy</a>.
                        </span>

                    </label>


                    <!-- Create Account -->

                    <button
                        type="submit"
                        class="register-button"
                    >
                        Create Account
                    </button>
                    
                    <p id="message"></p>

                </form>


                <!-- Login -->

                <div class="login-text">

                    Already have an account?

                    <a href="login.html">
                        Sign in
                    </a>

                </div>


            </div>

        </section>

    </main>


    <!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Supabase Connection -->
<script src="js/supabase.js"></script>

<!-- Registration Logic -->
<script src="js/register.js"></script>


</body>

</html>
